name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://exam:exam@127.0.0.1:5432/exam_poc
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: exam_poc
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: exam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exam -d exam_poc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.12.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm run test
      - run: pnpm build
      - name: Check local application endpoints
        run: |
          pnpm --filter api start > api.log 2>&1 &
          pnpm --filter web dev > web.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3001/healthz && curl --fail --silent http://127.0.0.1:5173/ && exit 0
            sleep 1
          done
          cat api.log
          cat web.log
          exit 1
