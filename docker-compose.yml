services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: exam_poc
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U exam -d exam_poc']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
